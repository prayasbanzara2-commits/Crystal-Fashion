<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#c75d3a">
    <meta property="og:title" content="Page Not Found | Crystal Fashion">
    <meta property="og:description" content="This page could not be found. Return to Crystal Fashion for premium Nepal-made handcrafted fashion.">
    <meta property="og:image" content="https://www.crystalfashionnepal.com/images/logo.png">
    <link rel="canonical" href="https://www.crystalfashionnepal.com/404.html">
    <title>Page Not Found · Crystal Fashion</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(180deg, #fffaf5 0%, #f5eee5 100%);
        }
        .error-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.5rem;
        }
        .error-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            padding: clamp(2rem, 4vw, 3rem);
        }
        .error-code {
            font-size: clamp(4rem, 12vw, 9rem);
            font-family: 'Playfair Display', serif;
            line-height: 0.9;
            color: var(--terracotta);
            margin-bottom: 0.5rem;
        }
        .error-card h1 {
            margin-bottom: 0.75rem;
            font-size: clamp(2rem, 5vw, 3rem);
        }
        .error-card p {
            color: var(--brown-soft);
            max-width: 520px;
            margin: 0 auto 1.6rem;
            line-height: 1.7;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1>Page not found</h1>
            <p>The page you are looking for may have moved, been removed, or never existed. Let’s take you back to somewhere beautiful.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Back to home</a>
                <a href="/#products" class="btn btn-secondary">View collection</a>
                <a href="blog.html" class="btn btn-secondary">Visit journal</a>
            </div>
        </div>
    </div>
    <script src="/js/cookie-consent.js"></script>
</body>
</html>
