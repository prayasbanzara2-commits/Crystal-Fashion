<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=index.html#products">
    <meta name="description" content="Crystal Fashion collection. Redirecting to the main collection page.">
    <meta name="theme-color" content="#c75d3a">
    <title>Redirecting to Collection · Crystal Fashion</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-page {
            background: linear-gradient(180deg, var(--bg) 0%, #fefaf5 100%);
        }

        .gallery-hero {
            position: relative;
            overflow: hidden;
            padding-top: 120px;
            padding-bottom: 3rem;
            background:
                radial-gradient(circle at top left, rgba(199,93,58,0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(212,165,116,0.18), transparent 30%),
                linear-gradient(135deg, #2f2219 0%, #3b2a20 30%, #4a3428 100%);
        }

        .gallery-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(16,10,6,0.10), rgba(16,10,6,0.38));
        }

        .gallery-hero-inner {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: clamp(2rem, 4vw, 4rem);
            align-items: center;
        }

        .gallery-hero-copy {
            color: rgba(250,245,236,0.9);
        }

        .gallery-hero-copy h1 {
            color: #fff;
            font-size: clamp(2.6rem, 5vw, 5rem);
            line-height: 0.96;
            margin-bottom: 1.1rem;
            letter-spacing: -0.04em;
        }

        .gallery-hero-copy p {
            max-width: 620px;
            font-size: 1.05rem;
            color: rgba(250,245,236,0.78);
            margin-bottom: 1.8rem;
        }

        .gallery-hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .gallery-hero-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
        }

        .gallery-stat-pill {
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.88);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .gallery-showcase {
            position: relative;
            min-height: 500px;
        }

        .showcase-card {
            position: absolute;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .showcase-card.main {
            inset: 50px 30px 10px 30px;
            transform: rotate(-2deg);
        }

        .showcase-card.secondary {
            width: 48%;
            height: 180px;
            right: 0;
            bottom: 30px;
            transform: rotate(4deg);
        }

        .showcase-card.tertiary {
            width: 38%;
            height: 170px;
            left: 0;
            bottom: 0;
            transform: rotate(-5deg);
        }

        .showcase-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.08) contrast(1.04);
        }

        .showcase-badge {
            position: absolute;
            left: 18px;
            bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(17,13,9,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            padding: 0.45rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gallery-collection {
            padding: clamp(3.5rem, 7vw, 5.5rem) 0 4rem;
        }

        .gallery-toolbar {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .gallery-toolbar h2 {
            margin-top: 0.4rem;
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .gallery-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: flex-end;
        }

        .gallery-filter {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--brown-2);
            padding: 0.72rem 1rem;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .gallery-filter:hover,
        .gallery-filter.active {
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-dark));
            color: #fff;
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(199,93,58,0.22);
        }

        .gallery-shell {
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            gap: 1.5rem;
            align-items: start;
        }

        .gallery-aside {
            position: sticky;
            top: 90px;
        }

        .aside-panel {
            background: linear-gradient(180deg, #fff 0%, var(--ivory-warm) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.3rem 1.2rem;
            box-shadow: var(--shadow-md);
        }

        .aside-panel h3 {
            font-size: 1.15rem;
            margin-bottom: 0.8rem;
        }

        .aside-panel ul {
            display: grid;
            gap: 0.8rem;
        }

        .aside-panel li {
            display: flex;
            align-items: start;
            gap: 0.7rem;
            font-size: 0.9rem;
            color: var(--brown-2);
            line-height: 1.5;
        }

        .aside-panel li span {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(199,93,58,0.12);
            color: var(--terracotta);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            flex-shrink: 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.3rem;
        }

        .gallery-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: transform 0.32s ease, box-shadow 0.32s ease;
            position: relative;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .gallery-card-image {
            position: relative;
            aspect-ratio: 4 / 4.5;
            background: var(--ivory-warm);
            overflow: hidden;
        }

        .gallery-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .gallery-card:hover .gallery-card-image img {
            transform: scale(1.06);
        }

        .gallery-card-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 0.38rem 0.72rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.85);
            color: var(--brown-2);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            backdrop-filter: blur(6px);
        }

        .gallery-card-body {
            padding: 1rem 1rem 1.15rem;
        }

        .gallery-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.55rem;
        }

        .gallery-card-price {
            color: var(--terracotta);
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .gallery-card-moq {
            color: var(--brown-soft);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .gallery-card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            color: var(--brown);
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        .gallery-card-copy {
            color: var(--brown-soft);
            font-size: 0.92rem;
            line-height: 1.65;
            margin-bottom: 1rem;
        }

        .gallery-card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
        }

        .gallery-card-actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--terracotta);
            font-weight: 700;
            font-size: 0.88rem;
        }

        .gallery-card-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1rem;
            background: linear-gradient(135deg, var(--terracotta), var(--terracotta-dark));
            color: #fff;
            border-radius: 999px;
            font-size: 0.79rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            box-shadow: 0 10px 22px rgba(199,93,58,0.22);
        }

        .gallery-cta {
            padding: 0 0 4rem;
        }

        .gallery-cta-wrap {
            background: linear-gradient(135deg, #fff 0%, var(--ivory-warm) 100%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            display: flex;
            justify-content: space-between;
            gap: 1.2rem;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: var(--shadow-md);
        }

        .gallery-cta-copy h3 {
            font-size: clamp(1.5rem, 2.3vw, 2.3rem);
            margin-bottom: 0.3rem;
        }

        .gallery-cta-copy p {
            color: var(--brown-soft);
            margin: 0;
        }

        @media (max-width: 980px) {
            .gallery-hero-inner,
            .gallery-shell {
                grid-template-columns: 1fr;
            }

            .gallery-aside {
                position: static;
            }

            .gallery-showcase {
                min-height: 360px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .gallery-hero {
                padding-top: 100px;
            }

            .gallery-hero-actions,
            .gallery-filters,
            .gallery-cta-wrap {
                flex-direction: column;
                align-items: stretch;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-showcase {
                min-height: 300px;
            }

            .showcase-card.main {
                inset: 20px 10px 20px 10px;
            }

            .showcase-card.secondary {
                width: 42%;
                right: 12px;
                bottom: 8px;
            }

            .showcase-card.tertiary {
                width: 35%;
                left: 12px;
                bottom: 8px;
            }
        }
    </style>
</head>
<body>
    <script>
        window.location.replace('index.html#products');
    </script>
    <main style="min-height:100vh;display:grid;place-items:center;padding:2rem;background:linear-gradient(180deg,#f8f1e7,#fffdfb);font-family:Inter,Arial,sans-serif;">
        <div style="max-width:620px;text-align:center;background:#fff;border:1px solid #eadcc4;border-radius:24px;padding:2.5rem 2rem;box-shadow:0 15px 35px rgba(45,31,23,0.08);">
            <div style="display:inline-block;padding:0.45rem 0.8rem;border-radius:999px;background:#f7eeea;color:#8d4c32;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-size:0.72rem;">Redirecting</div>
            <h1 style="font-size:clamp(2rem,4vw,3rem);margin:1rem 0 0.7rem;font-family:'Playfair Display',serif;">Our collection lives on the homepage.</h1>
            <p style="color:#6b5443;line-height:1.7;margin:0 0 1.5rem;">This page has been merged into the single premium collection experience for a cleaner, more focused boutique website.</p>
            <a href="index.html#products" style="display:inline-flex;align-items:center;justify-content:center;padding:0.8rem 1.3rem;border-radius:999px;background:linear-gradient(135deg,#c75d3a,#8e4330);color:#fff;text-decoration:none;font-weight:700;">Go to collection</a>
        </div>
    </main>
</body>
</html>
